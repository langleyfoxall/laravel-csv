name: run-tests

on:
  workflow_dispatch:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: xdebug

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Prepare coverage output
        run: mkdir -p build/logs

      - name: Run tests with coverage
        run: vendor/bin/pest --ci --coverage --coverage-clover=build/logs/clover.xml --min=0

      - name: Publish coverage summary
        run: |
          php -r '
          $coverage = simplexml_load_file("build/logs/clover.xml");
          $metrics = $coverage->project->metrics;
          $covered = (int) $metrics["coveredstatements"];
          $statements = (int) $metrics["statements"];
          $percentage = $statements > 0 ? round(($covered / $statements) * 100, 2) : 0.0;
          $summary = sprintf("## Test coverage\n\n**%.2f%%** statement coverage (%d/%d statements).\n", $percentage, $covered, $statements);
          file_put_contents(getenv("GITHUB_STEP_SUMMARY"), $summary, FILE_APPEND);
          printf("Coverage: %.2f%% (%d/%d statements)\n", $percentage, $covered, $statements);
          '
